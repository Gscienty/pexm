[package]
name = "bff"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.13"
prost = "0.13"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
auth-lib = { path = "../../lib/auth-lib" }
time = "0.3"
async-graphql = "7"
async-graphql-axum = "7"

[build-dependencies]
tonic-build = "0.13"