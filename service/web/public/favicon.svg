<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>试卷排版系统</title>
  <desc>具有宋韵风格的试卷排版系统图标</desc>

  <defs>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="sealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="58" fill="none" stroke="#4A90E2" stroke-width="2"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#4A90E2" stroke-width="1" stroke-dasharray="4 2"/>

  <g transform="translate(64, 64)">
    <path d="M-28 -32 L28 -32 L28 32 L-28 32 Z" fill="url(#paperGradient)" stroke="#E1E8ED" stroke-width="1.5" transform="rotate(-3)"/>
    <path d="M-26 -30 L26 -30 L26 30 L-26 30 Z" fill="none" stroke="#E1E8ED" stroke-width="0.5" transform="rotate(-3)"/>

    <g stroke="#B8C5D6" stroke-width="0.8" transform="rotate(-3)">
      <line x1="-22" y1="-20" x2="22" y2="-20"/>
      <line x1="-22" y1="-12" x2="22" y2="-12"/>
      <line x1="-22" y1="-4" x2="22" y2="-4"/>
      <line x1="-22" y1="4" x2="22" y2="4"/>
      <line x1="-22" y1="12" x2="22" y2="12"/>
      <line x1="-22" y1="20" x2="22" y2="20"/>
      <line x1="-14" y1="-28" x2="-14" y2="28"/>
      <line x1="0" y1="-28" x2="0" y2="28"/>
      <line x1="14" y1="-28" x2="14" y2="28"/>
    </g>

    <g fill="#5A6C7D" transform="rotate(-3)">
      <rect x="-18" y="-22" width="12" height="2" rx="1"/>
      <rect x="-18" y="-17" width="16" height="2" rx="1"/>
      <rect x="-18" y="-9" width="10" height="2" rx="1"/>
      <rect x="-6" y="-9" width="8" height="2" rx="1"/>
      <rect x="-18" y="-1" width="14" height="2" rx="1"/>
      <rect x="-18" y="7" width="11" height="2" rx="1"/>
      <rect x="-5" y="7" width="10" height="2" rx="1"/>
      <rect x="-18" y="15" width="8" height="2" rx="1"/>
    </g>

    <g transform="translate(16, 16) rotate(-8)">
      <rect x="-9" y="-9" width="18" height="18" rx="2" fill="url(#sealGradient)"/>
      <rect x="-5" y="-5" width="10" height="10" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <line x1="-3" y1="-3" x2="3" y2="-3" stroke="#FFFFFF" stroke-width="1"/>
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#FFFFFF" stroke-width="1"/>
      <line x1="-3" y1="3" x2="3" y2="3" stroke="#FFFFFF" stroke-width="1"/>
    </g>

    <g transform="translate(-32, 24) rotate(45)">
      <rect x="-2" y="-16" width="4" height="20" fill="#5A6C7D" rx="1"/>
      <path d="M-2 4 L0 12 L2 4 Z" fill="#4A90E2"/>
    </g>
  </g>

  <g fill="none" stroke="#E1E8ED" stroke-width="1">
    <path d="M18 18 L18 28 M18 18 L28 18"/>
    <path d="M110 18 L110 28 M110 18 L100 18"/>
    <path d="M18 110 L18 100 M18 110 L28 110"/>
    <path d="M110 110 L110 100 M110 110 L100 110"/>
  </g>
</svg>