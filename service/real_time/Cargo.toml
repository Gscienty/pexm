[package]
name = "real_time"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
y-octo = { git = "https://github.com/y-crdt/y-octo", branch = "main", features = [
  "events",
] }
auth-lib = { path = "../../lib/auth-lib/" }
futures = "0.3.32"
tonic = "0.13"
prost = "0.13"

[build-dependencies]
tonic-build = "0.13"
