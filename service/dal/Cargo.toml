[package]
name = "dal"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.34", features = ["bundled"] }
argon2 = "0.5"
async-trait = "0.1"
auth-lib = { path = "../../lib/auth-lib" }
rand_core = { version = "0.6", features = ["std"] }

[build-dependencies]
tonic-build = "0.13"