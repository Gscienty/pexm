[package]
name = "clsi"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
yrs = "0.27.2"
serde = "1.0.228"
serde_json = "1"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

[build-dependencies]
tonic-build = "0.13"
